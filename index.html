<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Two — I WILL.</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #080808;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      font-family: 'Cormorant Garamond', serif;
    }

    .reel {
      position: relative;
      width: 340px;
      height: 604px;
      overflow: hidden;
      border: 1px solid #161616;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
    }

    .text-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 44px;
      z-index: 2;
      pointer-events: none;
    }

    .text-block {
      text-align: center;
      width: 100%;
    }

    .phrase {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      color: #E8DCC8;
      font-size: 20px;
      line-height: 1.5;
      letter-spacing: 0.045em;
      opacity: 0;
      margin-top: 5px;
    }

    .phrase:first-child { margin-top: 0; }
    .phrase.gap          { margin-top: 22px; }
    .phrase.sig {
      margin-top: 38px;
      color: #C5A55A;
      font-size: 16px;
      letter-spacing: 0.18em;
    }

    .label {
      position: absolute;
      top: 12px; right: 14px;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: #1e1e1e;
      text-transform: uppercase;
      z-index: 3;
    }

    .progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 1px;
      background: #C5A55A;
      width: 0%;
      opacity: 0;
      z-index: 4;
    }

    .btn-replay {
      background: none;
      border: 1px solid #1e1a14;
      color: #3d3428;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 9px 26px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: border-color 0.4s, color 0.4s;
    }

    .btn-replay.show {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 1.2s ease, border-color 0.4s, color 0.4s;
    }

    .btn-replay:hover {
      border-color: #C5A55A;
      color: #C5A55A;
    }
  </style>
</head>
<body>

  <div class="reel">
    <canvas id="c"></canvas>
    <span class="label">9 · 16</span>
    <div class="text-overlay">
      <div class="text-block">
        <span class="phrase"       id="p1">The answers are</span>
        <span class="phrase"       id="p2">incomplete.</span>
        <span class="phrase gap"   id="p3">And still</span>
        <span class="phrase"       id="p4">—</span>
        <span class="phrase"       id="p5">it is yours to solve.</span>
        <span class="phrase sig"   id="p6">— W</span>
      </div>
    </div>
    <div class="progress" id="bar"></div>
  </div>

  <button class="btn-replay" id="replayBtn" onclick="run()">Replay</button>

  <script>
    // ── Canvas setup ───────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    const W = 340, H = 604;
    canvas.width  = W;
    canvas.height = H;

    // ── Stars ──────────────────────────────────────────────────────────
    let stars = [];

    function initStars() {
      stars = Array.from({ length: 300 }, () => ({
        x:  (Math.random() - 0.5) * W * 3,
        y:  (Math.random() - 0.5) * H * 3,
        z:  Math.random() * W,
        b:  0.25 + Math.random() * 0.55,    // brightness
        sz: 0.35 + Math.random() * 1.1      // base size
      }));
    }

    // ── Zoom speed curve ───────────────────────────────────────────────
    // 3s black → slow galaxy drift → accelerating zoom → peaks at — W → settles
    function zoomSpeed(t) {
      if (t < 3.0)  return 0;
      if (t < 5.5)  return 0.15 + (t - 3.0) / 2.5 * 0.25;   // materialise 0.15→0.40
      if (t < 24.5) return 0.40 + (t - 5.5) / 19.0 * 3.0;   // 0.40→3.40 slow build
      if (t < 27.0) return 3.40 - (t - 24.5) / 2.5 * 1.8;   // decelerate after — W
      return 1.6;                                              // cruise
    }

    // ── Background tint (near-black throughout, barely hints blue near end) ──
    function bgFill(t) {
      if (t < 22) return [6, 6, 8];
      if (t < 26) {
        const p = (t - 22) / 4;
        return [6, Math.round(6 + p * 2), Math.round(8 + p * 5)];
      }
      return [6, 8, 13];
    }

    // ── Draw one frame ─────────────────────────────────────────────────
    function drawFrame(t, speed) {
      const [r, g, b] = bgFill(t);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2, cy = H / 2;

      // Star global alpha: 0 while black, fades in 3→5.5s
      const starA = t < 3 ? 0 : Math.min(1, (t - 3) / 2.5);

      stars.forEach(star => {
        star.z -= speed;
        if (star.z <= 0) {
          star.x  = (Math.random() - 0.5) * W * 3;
          star.y  = (Math.random() - 0.5) * H * 3;
          star.z  = W;
        }

        const sx  = (star.x / star.z) * W + cx;
        const sy  = (star.y / star.z) * H + cy;
        if (sx < -4 || sx > W + 4 || sy < -4 || sy > H + 4) return;

        const depth = 1 - star.z / W;
        const sz    = Math.max(0.15, depth * star.sz);
        const alpha = depth * star.b * starA;

        // Motion streaks when zooming fast
        if (speed > 1.2 && alpha > 0.05) {
          const streakLen = Math.min(12, speed * 2.2);
          const dx = sx - cx, dy = sy - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 0) {
            const nx = dx / dist, ny = dy / dist;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(232,220,200,${alpha * 0.45})`;
            ctx.lineWidth   = Math.max(0.3, sz * 0.55);
            ctx.moveTo(sx, sy);
            ctx.lineTo(sx - nx * streakLen, sy - ny * streakLen);
            ctx.stroke();
          }
        }

        // Star dot
        ctx.beginPath();
        ctx.arc(sx, sy, sz, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(232,220,200,${alpha})`;
        ctx.fill();
      });

      // Vignette — frames the text
      const vig = ctx.createRadialGradient(cx, cy, cx * 0.25, cx, cy, cx * 1.55);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.62)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
    }

    // ── Text timing — mapped to Cornfield Chase piano notes ────────────
    // 3s black + note positions in the opening phrase (seconds)
    const PHRASES = [
      { id: 'p1', t:  6.5 },   // first note lands
      { id: 'p2', t:  9.2 },   // second note
      { id: 'p3', t: 12.6 },   // third note
      { id: 'p4', t: 16.1 },   // fourth — the pause beat
      { id: 'p5', t: 19.8 },   // fifth note
      { id: 'p6', t: 24.5 },   // last intro note — W appears, melody follows
    ];

    const FADE_MS = 4200;
    const EASE    = 'cubic-bezier(0.18, 0, 0.82, 1)';
    const TOTAL   = 30;

    // ── Animation loop ─────────────────────────────────────────────────
    let raf, startMs, triggered = {};

    function tick() {
      const t     = (performance.now() - startMs) / 1000;
      const speed = zoomSpeed(t);

      drawFrame(t, speed);

      // Reveal phrases
      PHRASES.forEach(({ id, t: mark }) => {
        if (!triggered[id] && t >= mark) {
          const el = document.getElementById(id);
          el.style.transition = `opacity ${FADE_MS}ms ${EASE}`;
          el.style.opacity    = '1';
          triggered[id]       = true;
        }
      });

      // Progress bar
      if (t > 3) {
        const bar = document.getElementById('bar');
        bar.style.opacity = '0.3';
        bar.style.width   = Math.min(((t - 3) / (TOTAL - 3)) * 100, 100) + '%';
      }

      const lastT  = PHRASES[PHRASES.length - 1].t;
      const finished = t > lastT + (FADE_MS / 1000) + 0.8;

      if (!finished) {
        raf = requestAnimationFrame(tick);
      } else {
        document.getElementById('replayBtn').classList.add('show');
      }
    }

    // ── Reset ──────────────────────────────────────────────────────────
    function reset() {
      cancelAnimationFrame(raf);
      triggered = {};
      initStars();

      PHRASES.forEach(({ id }) => {
        const el = document.getElementById(id);
        el.style.transition = 'none';
        el.style.opacity    = '0';
      });

      const bar = document.getElementById('bar');
      bar.style.transition = 'none';
      bar.style.width   = '0%';
      bar.style.opacity = '0';

      ctx.fillStyle = 'rgb(6,6,8)';
      ctx.fillRect(0, 0, W, H);

      document.getElementById('replayBtn').classList.remove('show');
    }

    function run() {
      reset();
      setTimeout(() => {
        startMs = performance.now();
        raf = requestAnimationFrame(tick);
      }, 60);
    }

    window.addEventListener('load', () => setTimeout(run, 200));
  </script>

</body>
</html>
